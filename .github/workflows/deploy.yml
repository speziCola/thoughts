name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and types
        run: npm run check
      - name: Build site
        run: npm run build
        env:
          # Served at spezicola.github.io/thoughts/ until a custom domain is set up.
          # Remove this once the domain points here, so the site builds at the root.
          SITE_BASE: /thoughts
          # Indexable (2026-11-21). To hide a staging copy from search engines again,
          # add SITE_NOINDEX: "true" here (noindex meta + empty robots.txt).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
